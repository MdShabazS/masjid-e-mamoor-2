<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#145b49" />
    <title>No connection · Masjid E Mamoor 2</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f6f0;
        color: #182e2a;
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 24px 16px;
        text-align: center;
        display: grid;
        gap: 14px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: #5e6e68;
      }
      button {
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #145b49;
        border: 0;
        border-radius: 10px;
        padding: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>
        This app needs the internet to show and save masjid records. Nothing you saved before is
        lost. Check your mobile data or Wi-Fi and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
